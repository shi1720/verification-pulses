[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verification-pulses"
version = "0.1.0"
description = "Reproducible dynamics and verification scheduling experiments for shared AI registers"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "matplotlib", "pandas", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
